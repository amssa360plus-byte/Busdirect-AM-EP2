        <div class="section">
            <div class="flex flex-col gap-6">
                <section aria-labelledby="reserve-title"
                    class="rounded-2xl border border-slate-200 bg-white p-2 shadow-xs sm:p-5">
                    <h2 id="reserve-title" class="mb-3 text-base font-bold text-slate-900">nouvelles reservation</h2>
                    <form id="reserve-form" novalidate>
                        <label for="reserve-name" class="mb-1 block text-sm font-semibold text-slate-700">Passager
                            Nom</label>
                        <input id="reserve-name" name="reserve-name" type="text" autocapitalize="none"
                            enterkeyhint="done" autocomplete="off" maxlength="60" placeholder="EXAMPLE MAX VERSTAPPEND"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-1 py-2 text-sm placeholder:text-slate-400" />
                        <label for="reserve-seat" class="mb-1 block text-sm font-semibold text-slate-700">siege
                        </label>
                        <select id="reserve-seat" name="reserve-seat"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">Choix</option>
                            <option value="1">Seat 1</option>
                            <option value="2">Seat 2</option>
                            <option value="3">Seat 3</option>
                            <option value="4">Seat 4</option>

                            <option value="18">Seat 18</option>
                            <option value="19">Seat 19</option>
                            <option value="20">Seat 20</option>
                        </select>
                        <button type="submit" id="reserve-submit"
                            class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-gray-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-gray-600 active:bg-teal-600 disabled:cursor-not-allowed disabled:opacity-50">
                            reserver une place
                        </button>
                    </form>
                    <div id="reserve-notification" class="mt-3" aria-live="polite"></div>
                    <div id="ticket-preview" class="mt-3 hidden" role="status" aria-live="polite"></div>
                </section>

                    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
                    <h2 id="modify-title" class="mb-3 text-base font-bold text-slate-900">modification</h2>
                    <form id="modify-form" novalidate>
                        <label for="modify-passenger"
                            class="mb-1 block text-sm font-semibold text-slate-700">Passagere</label>
                        <select id="modify-passenger" name="modify-passenger"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 pr-9 text-sm">
                            <option value="">Se</option>

                        </select>
                        <label for="modify-name" class="mb-1 block text-sm font-semibold text-slate-700">
                            NOM</label>
                        <input id="modify-name" type="text" autocapitalize="none" enterkeyhint="done" autocomplete="off"
                            maxlength="60"
                            class="mb-3 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm placeholder:text-slate-400"

                            siege</label>

                            enregistrer
                        </button>
                    </form>
                    <div id="modify-notification" class="mt-3" aria-live="polite"></div>
                </section>

                    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
                    <h2 id="cancel-title" class="mb-3 text-base font-bold text-slate-900">Cancel reservation</h2>
                    <form id="cancel-form" novalidate>
                        <label for="cancel-passenger"
                            class="mb-1 block text-sm font-semibold text-slate-700">Passenger</label>

                            <option value="3">Seat 3</option>

                            <option value="16">Seat 16</option>

                            <option value="18">Seat 18</option>
                            <option value="19">Seat 19</option>
                            <option value="20">Seat 20</option>

                        <button type="submit"

                            <i class="fa-solid fa-ban"></i>
